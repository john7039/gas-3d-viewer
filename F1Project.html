<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
      
      #back-btn {
        position: absolute; top: 20px; left: 20px; z-index: 100;
        padding: 10px 20px; background: white; border-radius: 8px;
        text-decoration: none; color: black; font-weight: bold; border: 2px solid #333;
      }
      
      #loader-container {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center; color: white; font-family: sans-serif;
        background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
        min-width: 200px;
      }
    </style>
  </head>
  <body>
    <a id="back-btn" href="<?= url ?>?page=Menu">⬅ 메뉴로</a>

    <div id="loader-container">
      <h2>🏎️ Loading Buggy...</h2>
      <p id="status">Connecting...</p>
      <p id="error-log" style="color: #ff6b6b; font-size: 0.8em; margin-top: 10px;"></p>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      // 1. Scene
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x222222); // 배경색

      // 2. Camera
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(5, 5, 10); // 카메라 위치 조정

      // 3. Renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 4. Light
      const ambientLight = new THREE.AmbientLight(0xffffff, 1);
      scene.add(ambientLight);
      
      const dirLight = new THREE.DirectionalLight(0xffffff, 3);
      dirLight.position.set(5, 10, 5);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 5. Grid
      const grid = new THREE.GridHelper(50, 50, 0x444444, 0x111111);
      scene.add(grid);

      // 6. Loader
      const loader = new GLTFLoader();
      const statusDiv = document.getElementById('status');
      const errorDiv = document.getElementById('error-log');
      const loaderContainer = document.getElementById('loader-container');

      // ✅ 수정된 URL: Khronos Group 공식 샘플 'Buggy' (매우 안정적)
      const carModelUrl = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Buggy/glTF-Binary/Buggy.glb';

      statusDiv.innerText = "Downloading Model...";

      loader.load(carModelUrl, 
        (gltf) => {
          const car = gltf.scene;
          
          // 모델 크기 조절 (Buggy는 크기가 좀 작아서 0.1배 정도가 적당)
          car.scale.set(0.1, 0.1, 0.1); 
          car.position.y = 0;

          car.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          
          scene.add(car);
          loaderContainer.style.display = 'none'; // 성공하면 로딩창 끄기
        },
        (xhr) => {
          if (xhr.total > 0) {
            const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
            statusDiv.innerText = "Loading: " + percent + "%";
          } else {
             statusDiv.innerText = "Downloading... (Size unknown)";
          }
        },
        (error) => {
          console.error(error);
          statusDiv.innerText = "❌ Download Failed";
          errorDiv.innerText = "Check Console for details.\n" + error.message;
        }
      );

      // 7. Controls
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.autoRotate = true;
      controls.enableDamping = true;

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
